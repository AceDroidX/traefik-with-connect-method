name: Build Docker

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_name }}
  IMAGE_NAME: acedroidx/traefik_with_connect_method
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 48

jobs:
  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Branch name must be a valid Docker image tag.'
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Enable Corepack
        run: npm i -g corepack

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: webui/.nvmrc
          cache: yarn
          cache-dependency-path: webui/yarn.lock

      - name: Set up safe-chain
        working-directory: webui
        run: |
          npm i -g @aikidosec/safe-chain
          safe-chain setup-ci

      - name: Build WebUI
        working-directory: webui
        env:
          VITE_APP_BASE_API_URL: /api
        run: |
          yarn install --immutable
          yarn test
          yarn tsc
          yarn lint
          yarn build

      - name: Build linux/amd64 binary
        run: make binary GOOS=linux GOARCH=amd64 VERSION="$VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          cache-from: type=gha,scope=naive-connect-amd64
          cache-to: type=gha,mode=max,scope=naive-connect-amd64
